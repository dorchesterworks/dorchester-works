<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#020918"/>
      <stop offset="45%" stop-color="#0A1650"/>
      <stop offset="80%" stop-color="#2A0810"/>
      <stop offset="100%" stop-color="#3C0F18"/>
    </linearGradient>
    <radialGradient id="halo" cx="30%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rGlow" cx="80%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#C41230" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C41230" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sf" cx="38%" cy="28%" r="72%">
      <stop offset="0%"  stop-color="#FFFACC"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860A"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tglow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="630"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#halo)"/>
    <rect width="1200" height="630" fill="url(#rGlow)"/>

    <!-- Diagonal accent -->
    <polygon points="520,0 560,0 440,630 400,630" fill="white" opacity="0.018"/>

    <!-- Star field -->
    <g fill="white">
      <circle cx="30"  cy="35"  r="1.4" opacity="0.6"/>
      <circle cx="110" cy="18"  r="1.0" opacity="0.45"/>
      <circle cx="210" cy="48"  r="1.8" opacity="0.55"/>
      <circle cx="60"  cy="95"  r="1.0" opacity="0.4"/>
      <circle cx="170" cy="78"  r="1.4" opacity="0.5"/>
      <circle cx="960" cy="28"  r="1.4" opacity="0.55"/>
      <circle cx="1060" cy="55" r="1.0" opacity="0.45"/>
      <circle cx="1150" cy="32" r="1.8" opacity="0.6"/>
      <circle cx="920" cy="75"  r="1.0" opacity="0.4"/>
      <circle cx="1040" cy="90" r="1.4" opacity="0.5"/>
      <circle cx="40"  cy="560" r="1.0" opacity="0.4"/>
      <circle cx="130" cy="590" r="1.4" opacity="0.45"/>
      <circle cx="1080" cy="570" r="1.0" opacity="0.4"/>
      <circle cx="1140" cy="595" r="1.4" opacity="0.45"/>
      <circle cx="580" cy="20"  r="1.0" opacity="0.4"/>
      <circle cx="640" cy="608" r="1.4" opacity="0.4"/>
    </g>

    <!-- Decorative rings behind star -->
    <circle cx="295" cy="315" r="222" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.1"/>
    <circle cx="295" cy="315" r="200" fill="none" stroke="#C41230" stroke-width="2" opacity="0.22"/>
    <circle cx="295" cy="315" r="222" fill="url(#halo)"/>

    <!-- Star glow -->
    <polygon points="295,95 333,215 462,215 362,287 400,407 295,335 190,407 228,287 128,215 257,215"
      fill="#FFD700" opacity="0.18" filter="url(#glow)"/>

    <!-- Main star -->
    <polygon points="295,100 331,210 458,210 360,282 396,402 295,330 194,402 230,282 132,210 259,210"
      fill="url(#sf)" filter="url(#soft)"/>

    <!-- Star sheen -->
    <polygon points="295,128 322,210 398,210 338,254 360,334 295,290 230,334 252,254 192,210 268,210"
      fill="white" opacity="0.13"/>

    <!-- Vertical divider -->
    <line x1="580" y1="60" x2="580" y2="570" stroke="#FFD700" stroke-width="1" opacity="0.12"/>

    <!-- Eyebrow -->
    <text x="640" y="142" fill="#FFD700" opacity="0.65"
          font-family="Georgia,serif" font-size="16" font-weight="400" letter-spacing="7">
      MOBILE APP GAME STUDIO
    </text>

    <!-- Top rule -->
    <line x1="640" y1="160" x2="1160" y2="160" stroke="#FFD700" stroke-width="1" opacity="0.2"/>

    <!-- Dorchester -->
    <text x="636" y="250" fill="#FFFFFF"
          font-family="Georgia,serif" font-size="72" font-weight="900"
          filter="url(#tglow)" opacity="0.97">
      Dorchester
    </text>

    <!-- Works -->
    <text x="636" y="330" fill="#FFD700"
          font-family="Georgia,serif" font-size="72" font-weight="900"
          filter="url(#tglow)">
      Works
    </text>

    <!-- Bottom rule -->
    <line x1="640" y1="352" x2="1160" y2="352" stroke="#FFD700" stroke-width="1" opacity="0.2"/>

    <!-- Introducing line -->
    <text x="640" y="400" fill="rgba(245,240,232,0.75)"
          font-family="Georgia,serif" font-size="28" letter-spacing="1">
      Introducing 1776 Trivia
    </text>

    <!-- Tagline -->
    <text x="640" y="442" fill="rgba(245,240,232,0.55)"
          font-family="Georgia,serif" font-size="20" font-style="italic">
      Celebrating 250 years of American independence
    </text>

    <!-- Date pill -->
    <rect x="640" y="468" width="180" height="40" rx="20" fill="rgba(196,18,48,0.75)"/>
    <text x="730" y="493" text-anchor="middle" fill="#FFE566"
          font-family="Georgia,serif" font-size="15" font-weight="700" letter-spacing="3">
      July 4th 2026
    </text>

    <!-- URL -->
    <text x="640" y="565" fill="rgba(245,240,232,0.35)"
          font-family="sans-serif" font-size="16" letter-spacing="2">
      dorchesterworks.com
    </text>

    <!-- Star accents -->
    <polygon points="590,160 593,169 602,169 595,174 598,183 590,178 582,183 585,174 578,169 587,169"
      fill="#FFD700" opacity="0.7" filter="url(#soft)"/>
    <polygon points="590,352 593,361 602,361 595,366 598,375 590,370 582,375 585,366 578,361 587,361"
      fill="#FFD700" opacity="0.7" filter="url(#soft)"/>

    <!-- Corner ornaments -->
    <g stroke="#FFD700" stroke-width="1.5" fill="none" opacity="0.18">
      <path d="M18,18 L18,48 M18,18 L48,18"/>
      <path d="M1182,18 L1182,48 M1182,18 L1152,18"/>
      <path d="M18,612 L18,582 M18,612 L48,612"/>
      <path d="M1182,612 L1182,582 M1182,612 L1152,612"/>
    </g>

    <!-- Bottom tricolor stripe -->
    <rect x="0"   y="620" width="400" height="10" fill="#C41230" opacity="0.7"/>
    <rect x="400" y="620" width="400" height="10" fill="white"   opacity="0.12"/>
    <rect x="800" y="620" width="400" height="10" fill="#020918" opacity="0.7"/>
  </g>
</svg>
